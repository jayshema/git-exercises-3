<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>shop here</title>

<style>
    *{
        margin: 0;
        padding: 0;
        font-family:'poppins','sans-serif';
        box-sizing: border-box;
    }
    header{
        position:relative;
        align-items: center;
        justify-content: space-between;
        background-color: rgba(240, 109, 39, 0.929);
        height: 88px;
        padding: 1rem 20%;
        z-index: 1;

    }
    #logo{
        margin-top: 5px;
        margin-left: -190px;
        font-size: 160%;
        font-weight: bold;

        color: aliceblue;
        cursor: pointer;
    }
    .cont{
        display: flex;
        justify-content:center;
        margin-right: 10px;
    }
    .cont li{
        list-style: none;
        margin-left: 30px;
    }
    .cont li a{
        color: rgb(17, 17, 18);
        text-decoration: none;
        text-align: center;
    }
    .dropd li a {
        display: none;
    }
    .dropd li a:hover{
        display:  block;
        text-align: center;
    }
    .srch{
        margin-left: 190px;
        margin-right:1px ;
        border: 40%;
        border-radius: 8px;
        height: 30px;
        font-size: 20px;
        font-weight:500;
    }
    
    .btns{
        width: 60px;
        border: 40%;
        height: 30px;
        border-radius: 8px;
        background-color: rgba(240, 109, 39, 0.929);
        cursor: pointer;
    }
</style>
<body>
    <header>
        <div id="logo"> <p>Shop Here</p></div>

            <li><a href="">Home</a></li>
            <li><a href="">Categolies</a>
                <ul class="dropd">
                    <li><a href="">Shoes</a></li>
                    <li><a href="">clothes</a></li>
                    <li><a href="">Electronis</a></li>
                    <li><a href="">Mechanics</a></li>
                </ul>
            
            </li>
            <li><a href="">Servise</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact Us</a></li>
            <input class="srch" type="text" >
            <button class="btns">Search</button>
        </div>

    </header>
    
</body>
</html>
